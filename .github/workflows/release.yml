name: Release ArcSpace

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/ArcSpace/ArcSpace.csproj

      - name: Publish portable EXE
        run: dotnet publish src/ArcSpace/ArcSpace.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Verify release payload
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/ArcSpace.exe")) {
            throw "publish/ArcSpace.exe was not produced"
          }
          Get-FileHash "publish/ArcSpace.exe" -Algorithm SHA256 | Format-List

      - name: Publish GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag "publish/ArcSpace.exe" --clobber
          }
          else {
            gh release create $tag "publish/ArcSpace.exe" --title "ArcSpace $tag" --generate-notes
          }
